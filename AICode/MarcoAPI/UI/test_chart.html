<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>测试</title>
<style>*{margin:0;padding:0}html,body,#chart{width:100%;height:100vh;background:#131722}</style>
<script src="lc.min.js"></script>
</head><body>
<div id="chart"></div>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { type: LightweightCharts.ColorType.Solid, color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
});
const series = chart.addHistogramSeries({color: '#ef5350'});
series.setData([
    {time: 1735896900, value: 100},
    {time: 1735897200, value: 200},
    {time: 1735897500, value: 150},
    {time: 1735897800, value: 300},
]);
chart.timeScale().fitContent();
</script>
</body></html>
